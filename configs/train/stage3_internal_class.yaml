device: cuda
encoder:
  name: dinov2
  model_name: /tmp/hf/hub/models--facebook--dinov2-large/snapshots/a18992645e496e6d21ea90829a6652ed6f75ec47
  prefix_tokens: 1
  patch_size: 16
fae:
  noise_tau: 0.0
  reshape_to_2d: true
  normalize_latents: true
  latent_stats_path: checkpoints/latent_stats/dinov2_large_spatial.pt
  rope_base: 10000.0
pixel_decoder:
  image_size: 256
  patch_size: 16
  hidden_dim: 1024
  num_layers: 24
  num_heads: 16
  head_dim: 64
  use_rope_2d: true
conditioning:
  type: class
  num_classes: 1000
generator:
  name: internal_dit
  model_dim: 768
  depth: 12
  num_heads: 12
  head_dim: 64
  cond_dim: 1024
  objective: diffusion
  prediction_type: v_prediction
  use_rope_2d: false
  sample_size: 16
  in_channels: 32
bridge:
  enabled: true
  hidden_channels: 256
  num_res_blocks: 2
  resize_mode: bilinear
stage3:
  autoencoder_checkpoint: checkpoints/stage2_rae_finetune/dinov2_large/latest.pt
  generator_checkpoint: checkpoints/stage3_internal/dinov2_large/latest.pt
  bridge_cycle_weight: 0.0
train:
  batch_size: 8
  num_workers: 4
  lr: 1.0e-4
  weight_decay: 0.05
  epochs: 100
  output_dir: checkpoints/stage3_internal/dinov2_large
  dtype: bf16
  skip_oom_batches: true
data:
  root: /tmp/data
sampling:
  num_steps: 30
  output_dir: samples/internal_dinov2_large
