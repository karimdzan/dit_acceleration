# Experimental Sana-Sprint adapter on top of RAE latents.
device: cuda
encoder:
  name: siglip2
  model_name: google/siglip2-large-patch16-256
  processor_name: google/siglip2-large-patch16-256
  input_size: 256
  prefix_tokens: 0
  patch_size: 16
fae:
  noise_tau: 0.0
  reshape_to_2d: true
  normalize_latents: true
  latent_grid_size: 16
  latent_stats_path: checkpoints/latent_stats/siglip2_large_spatial.pt
  rope_base: 10000.0
pixel_decoder:
  image_size: 256
  patch_size: 16
  hidden_dim: 1152
  num_layers: 28
  num_heads: 16
  head_dim: 72
  mlp_ratio: 4.0
  use_rope_2d: true
conditioning:
  type: text
generator:
  name: diffusers_sana
  pipeline_name_or_path: Efficient-Large-Model/Sana_Sprint_1.6B_1024px_diffusers
  pipeline_class: SanaSprintPipeline
  torch_dtype: bfloat16
  objective: flow_matching
  train_mode: lora
  sample_size: 32
  in_channels: 32
bridge:
  enabled: true
  hidden_channels: 512
  num_res_blocks: 3
  model_height: 32
  model_width: 32
stage3:
  autoencoder_checkpoint: checkpoints/stage1_rae/siglip2_large/latest.pt
  generator_checkpoint: checkpoints/stage3_sana_sprint_1p6b/latest.pt
  bridge_cycle_weight: 0.05
train:
  batch_size: 1
  grad_accum_steps: 16
  num_workers: 4
  lr: 5.0e-5
  weight_decay: 0.01
  epochs: 20
  ema_decay: 0.999
  clip_grad: 1.0
  lr_scheduler: cosine
  warmup_epochs: 2
  min_lr_ratio: 0.2
  output_dir: checkpoints/stage3_sana_sprint_1p6b
  dtype: bf16
data:
  root: /tmp/data
sampling:
  num_steps: 2
  output_dir: samples/sana_sprint_1p6b
