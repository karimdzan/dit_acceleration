device: cuda
encoder:
  name: vit_mae
  model_name: /home/kaytkhadzhayev/.cache/huggingface/hub/models--facebook--vit-mae-base/snapshots/e6bc0422fef212158e4205f3f8b6dd005ca6e620/
  prefix_tokens: 1
  patch_size: 16
fae:
  noise_tau: 0.8
  reshape_to_2d: true
  normalize_latents: true
  latent_stats_path: checkpoints/latent_stats/vit_mae_base_spatial.pt
  rope_base: 10000.0
pixel_decoder:
  image_size: 256
  patch_size: 16
  hidden_dim: 768
  num_layers: 24
  num_heads: 12
  head_dim: 64
  mlp_ratio: 4.0
  use_rope_2d: true
stage1:
  use_lpips: true
  perceptual_weight: 0.1
  use_gan: true
  disc_lr: 1.0e-4
  adversarial_weight: 0.1
  use_adaptive_gan_weight: true
  lpips_start_epoch: 0
  disc_start_epoch: 6
  adv_start_epoch: 8
train:
  batch_size: 128
  num_workers: 8
  lr: 1.0e-4
  weight_decay: 0.0
  epochs: 16
  output_dir: checkpoints/stage1_rae/vit_mae_base
  dtype: bf16
  skip_oom_batches: true
data:
  root: /tmp/data
compute_features:
  output: checkpoints/latent_stats/vit_mae_imagenet1k.pt
  max_batches: null
  channel_only: false
