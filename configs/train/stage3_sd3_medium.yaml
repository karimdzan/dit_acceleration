device: cuda
encoder:
  name: dinov2
  model_name: /tmp/hf/hub/models--facebook--dinov2-large/snapshots/a18992645e496e6d21ea90829a6652ed6f75ec47
  prefix_tokens: 1
  patch_size: 16
fae:
  noise_tau: 0.0
  reshape_to_2d: true
  normalize_latents: true
  latent_stats_path: checkpoints/latent_stats/dinov2_large_spatial.pt
  rope_base: 10000.0
pixel_decoder:
  image_size: 256
  patch_size: 16
  hidden_dim: 768
  num_layers: 24
  num_heads: 12
  head_dim: 64
  use_rope_2d: true
conditioning:
  type: text
generator:
  name: diffusers_sd3
  pipeline_name_or_path: stabilityai/stable-diffusion-3-medium-diffusers
  pipeline_class: StableDiffusion3Pipeline
  torch_dtype: bfloat16
  objective: diffusion
  prediction_type: epsilon
  train_mode: frozen
  sample_size: 32
  in_channels: 16
bridge:
  enabled: true
  hidden_channels: 256
  num_res_blocks: 2
  model_height: 32
  model_width: 32
stage3:
  autoencoder_checkpoint: checkpoints/stage1_rae/dinov2_large/latest.pt
  generator_checkpoint: checkpoints/stage3_sd3_medium/latest.pt
  bridge_cycle_weight: 0.1
train:
  batch_size: 2
  num_workers: 4
  lr: 5.0e-5
  weight_decay: 0.01
  epochs: 3
  output_dir: checkpoints/stage3_sd3_medium
  dtype: bf16
data:
  root: /tmp/data
sampling:
  num_steps: 28
  output_dir: samples/sd3_medium
