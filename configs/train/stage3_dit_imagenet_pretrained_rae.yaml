# ImageNet-1K 256 DiT^DH-XL training using the official pretrained RAE decoder checkpoint.
# This avoids a scratch stage-1 run and uses the released DINOv2-with-registers base RAE decoder path.
device: cuda
encoder:
  name: dinov2
  model_name: facebook/dinov2-with-registers-base
  input_size: 224
  prefix_tokens: 5
  patch_size: 14
fae:
  noise_tau: 0.0
  reshape_to_2d: true
  normalize_latents: true
  latent_grid_size: 16
  pretrained:
    preset: dinov2_wreg_base_imagenet256_vitxl_n08
    repo_id: nyu-visionx/RAE-collections
    # Point this at a repo already downloaded with `hf download` or a cache snapshot.
    snapshot_dir: /path/to/RAE-collections
    load_ema: true
    strict: false
pixel_decoder:
  image_size: 256
  patch_size: 16
  hidden_dim: 1152
  num_layers: 28
  num_heads: 16
  head_dim: 72
  mlp_ratio: 4.0
  use_rope_2d: true
conditioning:
  type: class
  num_classes: 1000
generator:
  name: internal_dit_dh
  hidden_size: [1152, 2048]
  depth: [28, 2]
  num_heads: [16, 16]
  mlp_ratio: 4.0
  num_classes: 1000
  class_dropout_prob: 0.1
  use_qknorm: false
  use_swiglu: true
  use_rope: true
  use_rmsnorm: true
  wo_shift: false
  use_pos_embed: true
  objective: linear_velocity
  prediction_type: velocity
  time_dist_type: logit-normal_0_1
bridge:
  enabled: false
transport:
  path_type: Linear
  prediction: velocity
  loss_weight: null
  time_dist_type: logit-normal_0_1
guidance:
  method: cfg
  scale: 1.0
  t_min: 0.0
  t_max: 1.0
stage3:
  generator_checkpoint: checkpoints/stage3_ditdh_imagenet256_1xh100/latest.pt
  bridge_cycle_weight: 0.0
train:
  batch_size: 4
  grad_accum_steps: 16
  num_workers: 8
  lr: 1.0e-4
  betas: [0.9, 0.95]
  weight_decay: 0.0
  epochs: 240
  ema_decay: 0.9995
  clip_grad: 1.0
  scheduler:
    type: linear
    warmup_epochs: 10
    decay_end_epoch: 180
    final_lr: 2.0e-5
    base_lr: 1.0e-4
    warmup_from_zero: false
  output_dir: checkpoints/stage3_ditdh_imagenet256_1xh100
  dtype: bf16
  drop_last: true
  skip_oom_batches: false
data:
  root: /tmp/data
  return_none_on_error: true
  load_truncated_images: true
  warn_limit: 50
sampling:
  num_steps: 50
  output_dir: samples/ditdh_imagenet256_1xh100
