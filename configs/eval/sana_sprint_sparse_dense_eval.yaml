model_name_or_path: /tmp/hf/hub/models--Efficient-Large-Model--Sana_Sprint_0.6B_1024px_diffusers/snapshots/516c38fa7bb0d3be6bcf5df80bd6f61c66860c83
pipeline_class: SanaSprintPipeline
output_dir: samples/sana_sprint_sparse_dense_eval

generation:
  num_samples: 16
  batch_size: 1
  warmup_batches: 1
  num_inference_steps: 2
  guidance_scale: 4.5
  height: 1024
  width: 1024
  seed: 0
  dtype: bf16
  device: cuda
  output_type: pil
  max_sequence_length: 300
  max_timesteps: 1.5708
  intermediate_timesteps: 1.3
  num_images_per_prompt: 1
  prompts:
    - "a tiny astronaut hatching from an egg on the moon"
    - "a cinematic photo of a red fox in a snowy forest"
    - "a glass teapot on a wooden table, studio lighting"
    - "a small robot painting a watercolor landscape"

sparse_dense:
  enabled: true
  # Conservative first setting: process middle blocks at 1/4 token count.
  # SANA-Sprint 1024 f32 latent is typically 32x32 = 1024 tokens.
  # stride: 2 runs selected blocks at 16x16 = 256 tokens.
  start_layer: 7
  end_layer: 21
  every: 2
  stride: 2
  pool_mode: avg
  upsample_mode: nearest
  residual_scale: 1.0
  min_tokens: 256

side_by_side:
  n: 16
  columns: 2
