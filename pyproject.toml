[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pfd-dit"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2.0",
  "torchvision>=0.17.0",
  "diffusers>=0.30.0",
  "transformers>=4.44.0",
  "accelerate>=0.33.0",
  "safetensors>=0.4.3",
  "numpy>=1.26.0",
  "tqdm>=4.66.0",
  "Pillow>=10.0.0"
]
