[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dit_accel"
version = "0.1.0"
description = "Training-free inference acceleration for diffusion transformers."
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "torch>=2.4.0",
    "torchvision",
    "diffusers>=0.32.0",
    "transformers>=4.45.0",
    "accelerate>=1.0.0",
    "safetensors",
    "bitsandbytes>=0.44.0",
    "torchao>=0.5.0",
    "datasets>=2.18.0",
    "clean-fid>=0.1.35",
    "torchmetrics>=1.4.0",
    "open_clip_torch>=2.24.0",
    "hydra-core>=1.3.0",
    "omegaconf>=2.3.0",
    "pillow",
    "numpy",
    "tqdm",
    "einops",
    "pyyaml",
]

[project.optional-dependencies]
triton = ["triton>=2.1.0"]
dev = ["pytest>=7.0"]

[project.scripts]
dit-accel-generate = "dit_accel.cli.generate:main"
dit-accel-calibrate = "dit_accel.cli.calibrate:main"
dit-accel-evaluate = "dit_accel.cli.evaluate:main"
dit-accel-prepare = "dit_accel.cli.prepare:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"dit_accel.evaluation" = ["imagenet_classes.txt"]
